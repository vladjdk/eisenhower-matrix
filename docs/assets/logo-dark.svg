        <ellipse cx="8.5" cy="-4" rx="3.6" ry="4.4" fill="#fff"><animate attributeName="ry" values="4.4;4.4;0.6;4.4;4.4" keyTimes="0;0.9;0.93;0.96;1" dur="4.5s" repeatCount="indefinite"/></ellipse>
