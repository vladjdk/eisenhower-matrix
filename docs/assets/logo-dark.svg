<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 160" width="470" height="160" role="img" aria-label="Focus logo: a smiling blue tile popping out of a two-by-two grid">
  <title>Focus</title>
  
  <g id="m">
