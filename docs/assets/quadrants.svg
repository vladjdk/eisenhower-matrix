    <path d="M-3 9L3 9L0 6Z" fill="#5b6673"/>
    <path d="M0 9C-5 14 5 17 0 23" fill="none" stroke="#5b6673" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-5" cy="-12" rx="3" ry="5" fill="#fff" opacity=".45" transform="rotate(20 -5 -12)"/></g></g>
      <text x="584" y="336" font-size="28" font-weight="800" fill="#19242d" text-anchor="start" letter-spacing="-0.6">Let go</text>
      <text x="585" y="362" font-size="16" font-weight="400" fill="#5b6673" text-anchor="start">Not everything needs you.</text>
      <text x="585" y="383" font-size="16" font-weight="400" fill="#5b6673" text-anchor="start">Really. It is fine.</text>
