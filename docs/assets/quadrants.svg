      <text x="173" y="362" font-size="16" font-weight="400" fill="#5b6673" text-anchor="start">Loud, but not really yours.</text>
      <text x="173" y="383" font-size="16" font-weight="400" fill="#5b6673" text-anchor="start">Ask, automate, or keep it tiny.</text>
