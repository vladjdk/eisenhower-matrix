<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 504" width="884" height="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The four quadrants: Do first (urgent and important), Schedule (important, not urgent), Delegate (urgent, less important), Let go (neither).">
  <title>The four quadrants</title>
  <text x="264" y="36" font-size="15" font-weight="800" letter-spacing="2.5" fill="#5b6673" text-anchor="middle">URGENT</text>
  <text x="676" y="36" font-size="15" font-weight="800" letter-spacing="2.5" fill="#5b6673" text-anchor="middle">NOT URGENT</text>
  <text x="34" y="163" font-size="15" font-weight="800" letter-spacing="2.5" fill="#5b6673" text-anchor="middle" transform="rotate(-90 34 163)">IMPORTANT</text>
  <text x="34" y="389" font-size="15" font-weight="800" letter-spacing="2.5" fill="#5b6673" text-anchor="middle" transform="rotate(-90 34 389)">LESS IMPORTANT</text>
  <g>
      <rect x="64" y="56" width="400" height="214" rx="20" fill="#edf2ff" stroke="#bfcdf0" stroke-width="1.5"/>
