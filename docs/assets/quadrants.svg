      <text x="584" y="110" font-size="28" font-weight="800" fill="#19242d" text-anchor="start" letter-spacing="-0.6">Schedule</text>
      <text x="585" y="136" font-size="16" font-weight="400" fill="#5b6673" text-anchor="start">Matters a lot, just not today.</text>
      <text x="585" y="157" font-size="16" font-weight="400" fill="#5b6673" text-anchor="start">Give it a real slot.</text>
